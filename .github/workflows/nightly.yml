name: Nightly

# Checks that can fail for reasons outside the code under review, so they
# never block a pull request. A failed scheduled run emails the repo owner.
on:
  schedule:
    - cron: "23 6 * * *" # every day at 06:23 UTC
  workflow_dispatch:

concurrency:
  group: nightly
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  live:
    name: Live network tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      # Ignored tests with `live` in the name talk to the real services
      # (signed out, no credentials). They break when a provider changes its
      # unofficial API, which is exactly what this run is meant to catch.
      - name: Live tests
        run: cargo test --locked --no-fail-fast -- --ignored live

  advisories:
    name: New RustSec advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2

      # Catches advisories published after the last change to main.
      - name: cargo deny check advisories
        run: cargo deny --locked check advisories
