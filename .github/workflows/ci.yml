name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Shellify targets macOS and Linux (mpv IPC is Unix-only).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Tests
        run: cargo test --locked

  # Branch protection requires this one job, so the matrix above can change
  # without having to edit the repository settings.
  all-checks:
    name: All checks
    if: always()
    needs: [check]
    runs-on: ubuntu-latest
    steps:
      - name: Require every check to pass
        run: |
          if [ "${{ needs.check.result }}" != "success" ]; then
            echo "Checks finished with: ${{ needs.check.result }}"
            exit 1
          fi
