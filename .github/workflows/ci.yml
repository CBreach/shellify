name: CI

on:
  pull_request:
    # labeled/unlabeled re-run the checks when `no-tests-needed` is added or
    # removed (see the "Unit tests required" job).
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  workflow_dispatch:

# A newer push to the same branch or PR cancels the run in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Jobs start with read-only access; the ones that need more ask for it.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  check:
    name: Lint & unit tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        # Shellify targets macOS and Linux (mpv IPC is Unix-only).
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked --no-fail-fast

  integration:
    name: Integration tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install mpv (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends mpv

      - name: Install mpv (macOS)
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install mpv

      - run: mpv --version

      # The ignored tests drive a real mpv (a generated tone, `--ao=null`, no
      # network or audio device). Tests with `live` in the name need the
      # network, so they run in the nightly workflow instead. One thread keeps
      # the timing-sensitive player tests from competing for the CPU.
      - name: Integration tests
        run: cargo test --locked --no-fail-fast -- --ignored --skip live --test-threads=1

  dependencies:
    name: Dependencies (cargo-deny)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-deny@0.20.2

      # RustSec advisories, licenses, banned crates and allowed sources; the
      # policy is in deny.toml.
      - name: cargo deny check
        run: cargo deny --locked check --show-stats

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # The CLI is MIT licensed; the binary is checked against a pinned hash.
      - name: Install gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks.tar.gz gitleaks
          rm gitleaks.tar.gz

      # Scans every commit (for a PR, including its own), printing findings
      # with the secret redacted.
      - name: Scan the git history
        run: ./gitleaks git --redact --no-banner --verbose --exit-code 1 .

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read # check out the code
      security-events: write # upload results and read the alerts
    strategy:
      fail-fast: false
      matrix:
        # `actions` scans the workflows themselves (injection, permissions).
        language: [rust, actions]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-extended

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:${{ matrix.language }}

      # Fail on any open alert for this commit, so SAST findings block the
      # merge. Dismissing a false positive in the Security tab (with a reason)
      # clears it.
      - name: Fail on open alerts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event_name == 'pull_request' && format('refs/pull/{0}/merge', github.event.pull_request.number) || github.ref }}
          CATEGORY: /language:${{ matrix.language }}
        run: |
          alerts=$(gh api --paginate "repos/$REPO/code-scanning/alerts?ref=$REF&state=open&tool_name=CodeQL&per_page=100" \
            | jq -c --arg cat "$CATEGORY" '.[] | select(.most_recent_instance.category == $cat)')
          if [ -z "$alerts" ]; then
            echo "No open CodeQL alerts for $CATEGORY on $REF."
            exit 0
          fi
          echo "$alerts" | jq -r '"::error file=\(.most_recent_instance.location.path),line=\(.most_recent_instance.location.start_line),title=CodeQL \(.rule.id)::\(.rule.description) (\(.html_url))"'
          exit 1

  tests-required:
    name: Unit tests required
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Self-test the checker
        run: python3 -m unittest discover -s .github/scripts

      # Fails when the PR changes Rust code under src/ without adding or
      # changing a test. Opt out with the `no-tests-needed` label.
      - name: Require tests with code changes
        env:
          BASE_REF: origin/${{ github.base_ref }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 .github/scripts/check_tests.py

  coverage:
    name: Coverage (report only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Informational: not part of "All checks", and a failure here doesn't
    # fail the run.
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update && rustup default stable

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - uses: taiki-e/install-action@4cef1412cce204788f482e778a0b9187f9626a29 # v2.87.21
        with:
          tool: cargo-llvm-cov@0.9.1

      - name: Measure unit-test coverage
        run: |
          cargo llvm-cov --locked --summary-only | tee coverage.txt
          {
            echo "## Unit-test coverage"
            echo
            echo '```'
            cat coverage.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  # Branch protection requires this one job, so the jobs above can change
  # without having to edit the repository settings. Every blocking job must be
  # listed in `needs`.
  all-checks:
    name: All checks
    if: always()
    needs: [check, integration, dependencies, secrets, codeql, tests-required]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every check to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # "Unit tests required" only runs for pull requests.
          failed=$(echo "$RESULTS" | jq -r --arg event "$EVENT" '
            to_entries[]
            | select(.value.result != "success")
            | select(.key != "tests-required" or $event == "pull_request" or .value.result != "skipped")
            | .key' | paste -sd, -)
          if [ -n "$failed" ]; then
            echo "::error::These checks did not pass: $failed"
            exit 1
          fi
