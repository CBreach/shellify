# cargo-deny configuration: https://embarkstudios.github.io/cargo-deny/
# CI runs `cargo deny check` on every PR and push to main (the "Dependencies"
# job). Run it locally with `cargo install cargo-deny && cargo deny check`.

[graph]
# Shellify only builds for macOS and Linux (mpv IPC is Unix-only), so only
# check the dependencies those targets actually pull in.
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-unknown-linux-gnu",
    "x86_64-apple-darwin",
    "aarch64-apple-darwin",
]
all-features = true

[advisories]
# RustSec advisory database. Vulnerabilities, unsound crates and yanked
# versions fail the check; unmaintained crates only fail when we depend on
# them directly (transitive ones are reported but can't be fixed here).
unmaintained = "workspace"
yanked = "deny"
# Every entry must say why it's ignored and when to look again, e.g.
# { id = "RUSTSEC-0000-0000", reason = "not reachable: ... (revisit 2027-01)" },
ignore = []

[licenses]
# Licenses that are compatible with distributing Shellify under MIT.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MIT-0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
confidence-threshold = 0.9
exceptions = [
    # File-level copyleft: fine to depend on unmodified. Pulled in by
    # `directories` -> `dirs-sys`.
    { allow = ["MPL-2.0"], crate = "option-ext" },
]

[bans]
# Duplicate versions are common in the async ecosystem and not a security
# problem, so they're reported rather than failing the build.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"

[sources]
# Only crates.io. A git or alternative-registry dependency has to be added
# here on purpose.
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
